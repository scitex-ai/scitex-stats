[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scitex-stats"
version = "0.2.28"
description = "Publication-ready statistical testing framework with 25 tests, effect sizes, power analysis, and MCP server"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
authors = [
    { name = "Yusuke Watanabe", email = "noreply@scitex.ai" },
]
keywords = [
    "statistics",
    "statistical-testing",
    "hypothesis-testing",
    "effect-size",
    "power-analysis",
    "publication",
    "apa",
    "scientific",
    "mcp",
    "mcp-server",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    # Numerical / data / stats core — every test_* module touches these
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "statsmodels>=0.13.0",
    # 29 test modules import matplotlib at module top — effectively hard
    "matplotlib>=3.5.0",
    # CLI framework (scitex-stats <cmd>)
    "click>=8.0",
    # SciTeX ecosystem: linter plugin Rule class, skills installer, audit
    "scitex-dev>=0.11.7",
    "scitex-config>=0.3.0",
    # SciTeX logger — _logging.py prefers it over stdlib logging
    "scitex-logging>=0.1",
    # MCP server stack — bundled in default install so `scitex-stats mcp …` works out-of-the-box
    "mcp",
    "fastmcp>=2.0.0",
    # Pingouin — sphericity (Mauchly) in test_anova_rm and other advanced
    # parametric paths. scitex-stats is a stats package; users expect these
    # to work out-of-the-box, not via an extra.
    "pingouin>=0.5",
]

[project.optional-dependencies]
# Convenience meta-extra: cross-package integrations + alt-backend tests
# - figrecipe: lazy-imported plot helpers + scitex_stats↔figrecipe integration
# - torch:     tensor-preserving descriptive stats (numpy fallback if absent)
# PS-221 [all]-closure: every PUBLIC extra must be a subset of `all`, so the
# self-reference below folds bundle/dev/docs in. They stay PUBLIC (not
# `_`-renamed) because CI installs them by name: the org reusable workflows
# (scitex-ai/.github) run `pip install -e ".[docs]"` (rtd-sphinx-build) and
# `".[all,dev]"` (pytest-matrix, quality-audit), and README/CONTRIBUTING
# document `.[dev]` for contributors.
all = [
    "scitex-stats[bundle,dev,docs,report,server]",
    "figrecipe>=0.28.0",
    "torch>=2.0",
]
# PDF output of scitex_stats.report (HTML and Markdown need nothing extra).
# WeasyPrint also needs Pango from the OS package manager.
report = [
    "weasyprint>=60",
]
# Plot results as editable FigRecipe recipes (scitex_stats.plot, backend="auto").
# Looked up at call time only; without it plots render with plain matplotlib.
figrecipe = [
    "figrecipe>=0.28.0",
]
# Stats ↔ SciTeX bundle I/O: test_result_to_stats / save_stats / load_stats
# in scitex_stats._bundle_io require scitex-io's bundle subpackage. scitex-io
# imports the Stats schema back from scitex_stats, so it stays an optional
# extra (no hard/circular dep).
bundle = [
    "scitex-io>=0.2.16",
]
# Statistics app (standalone + hub integration): scitex_stats._django exposes
# the calculator as a SciTeX workspace app via the scitex-app SDK
# (scitex_app.embed.run_standalone / ScitexAppConfig) and scitex-ui's shell.
# `scitex-stats gui` (open/serve/status/stop) and the hub mount both need this.
# scitex-app is already a hard dep; scitex-ui + django are added here so the
# app boots out of the box.
server = [
    "django>=4.2",
    # >=0.24.0: stats.html extends `scitex_app/app_shell.html`, the shared
    # workspace shell the SDK began shipping in 0.24.0. Below that the
    # template resolves to nothing (TemplateDoesNotExist: scitex_app/
    # app_shell.html) and every page of the app 500s.
    "scitex-app>=0.24.0",
    # >=0.22.0: the app shell template loads scitex-ui's template-tag
    # libraries `scitex_static` (first shipped in 0.21.2 — it provides
    # `{% app_static %}`) and `scitex_project_picker`, and adopts the
    # canonical project selector asset `js/app/project-selector.js`
    # (0.22.0). A lower floor lets a resolver pick a scitex-ui whose
    # shell cannot render our template at all: every page returns 500
    # ("'scitex_static' is not a registered tag library").
    "scitex-ui>=0.22.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "pre-commit>=3.5.0",
    # Optional features whose tests live in the suite — installed in [dev]
    # so a fresh `pip install -e .[dev]` runs the full suite. See
    # _skills/general/01_ecosystem_02_dependency-and-version-pinning.md
    # `[dev]` extras completeness.
    "nbconvert>=7.0",     # executes example .ipynb in tests (PS-505)
    "ipykernel>=6.0",     # kernel for nbconvert --execute
    "openpyxl>=3.1",      # pandas to_excel used by _demo_*.py
    # test__messages.py reads the shipped .po with babel.messages (it pins
    # every emitted msgid to a JA translation). CI happened to get babel
    # transitively through `.[all]`; a plain `-e .[dev]` did not, so the
    # test failed with ModuleNotFoundError instead of asserting. Declare it.
    "babel>=2.0",
    # Optional cross-package integrations whose tests live in the suite,
    # so a fresh `pip install -e .[dev]` runs the full suite (PS-210).
    "scitex-io>=0.2.16",  # [bundle] extra: stats↔bundle I/O round-trip tests
    "figrecipe>=0.28.0",  # [all] extra: stats↔figrecipe annotation tests
    # [server] extra: Statistics app (Django) boot + mount tests. scitex-app
    # and scitex-ui are optional upstream (django-app only), but the app
    # tests import them unguarded, so a fresh `-e .[dev]` must provide them
    # at the same floors as [server] (PS-210).
    "django>=4.2",
    "scitex-app>=0.24.0",
    # `scitex_static` / `scitex_project_picker` libraries + the canonical
    # project-selector asset.
    "scitex-ui>=0.22.0",
    # Note: fastmcp / mcp / scitex-dev / scitex-logging / pingouin come in via [project.dependencies].
    "weasyprint>=60",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=1.25",
]

[project.scripts]
scitex-stats = "scitex_stats._cli:main"

[project.entry-points."scitex_dev.docs"]
scitex-stats = "scitex_stats"

[project.entry-points."scitex_dev.skills"]

scitex-stats = "scitex_stats"

[project.entry-points."scitex_dev.linter.plugins"]
stats = "scitex_stats._linter_plugin:get_plugin"

[project.entry-points."scitex.apps"]
stats = "scitex_stats._django.apps:StatsCalculatorConfig"

[project.urls]
Homepage = "https://github.com/scitex-ai/scitex-stats"
Documentation = "https://scitex-stats.readthedocs.io"
Repository = "https://github.com/scitex-ai/scitex-stats.git"
Issues = "https://github.com/scitex-ai/scitex-stats/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/scitex_stats"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --cov=scitex_stats --cov-report=term-missing"
# Slow layers are gated by an env var so the default suite stays fast and
# hermetic: `RUN_E2E=1` for tests/e2e (real browser + real server).
markers = [
    "e2e: slow end-to-end journey tests; gate with RUN_E2E=1",
]

[tool.coverage.run]
# parallel + multiprocessing concurrency so child Python interpreters
# (test_demos spawns demos via `python -m`, test_examples_smoke runs
# `jupyter nbconvert --execute`) emit their own `.coverage.<host>.<pid>`
# data files. pytest-cov combines them at session end.
parallel = true
source = ["scitex_stats"]
concurrency = ["multiprocessing", "thread"]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.scitex-linter]
library_dirs = ["src", "tests", "examples"]

[tool.scitex_dev.audit]
# PS-168 — Per-package secret + env-var prefix in GitHub Actions workflows.
# `GH_PERSONAL_ACCESS_TOKEN` is the ecosystem-wide cross-cutting PAT used
# by the contributor-assistant CLA action. The natural GITHUB_* namespace
# is reserved by GitHub Actions on the secret-name surface (HTTP 422 on
# every `gh secret set`), so the GH_ shorthand is the canonical
# substitute and is registered ecosystem-wide via PR #122 on scitex-dev
# (EXCEPTION_SECRETS_DEFAULT). This per-package entry pins the same
# exception inline so the audit passes on every scitex-dev version,
# independent of release timing.
ps168_secret_exceptions = ["GH_PERSONAL_ACCESS_TOKEN"]
