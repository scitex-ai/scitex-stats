name: ci

# ============================================================================
# CANONICAL scitex CI — thin org-reusable caller (the ONE per-repo shape).
# Rendered for scitex-stats by `scitex-dev ecosystem ci-template apply`.
#
# Job bodies live ONCE, org-side, in scitex-ai/.github@main — a shared
# workflow cannot drift per-repo (operator decision, 2026-07-21, superseding
# the retired consolidated pr-ci.yml/release-ci.yml pair). This file carries
# only triggers, concurrency, and thin `uses:` calls.
#
# Shared workflows admit native runners from the original event identity and
# confirmed organization membership. Hosted fallback is allowed by current
# policy. The optional qualified native test job additionally binds compute-03,
# image/runtime/helper bytes and the shared lifecycle resource.
#
# Required-status-check contexts (branch protection must reference these;
# under workflow_call GitHub renders "<caller-job-id> / <reusable job name>"):
#   pytest-matrix / pytest-matrix-on-ubuntu-py<X.YY>
#   import-smoke / import-smoke-on-ubuntu-py3-12
#   quality-audit / audit
#   rtd-sphinx-build / docs-sphinx
# ============================================================================

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    - cron: "0 17 * * *" # nightly 17:00 UTC (~02:00 JST), off-peak
  workflow_dispatch:
    inputs:
      native_test_profile:
        description: Run the qualified native test matrix (no artifacts or publication)
        type: boolean
        required: false
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs; NEVER cancel post-merge/protected-branch runs
  # (preserves the retired release-ci.yml coalescing semantic).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest-matrix:
    uses: scitex-ai/.github/.github/workflows/pytest-matrix.yml@main
    secrets: inherit
    with:
      # Durable fix for 2026-10-20 uv-cache corruption wave (archive-v0
      # ENOENT -> broken torch, org-02/04/05/06/07): copy instead of
      # hardlinking out of the shared uv cache, per infra recommendation.
      # Runs after checkout, exported via GITHUB_ENV before uv pip install.
      pre_test_command: echo "UV_LINK_MODE=copy" >> "$GITHUB_ENV"

  import-smoke:
    uses: scitex-ai/.github/.github/workflows/import-smoke.yml@main
    secrets: inherit

  quality-audit:
    uses: scitex-ai/.github/.github/workflows/quality-audit.yml@main
    secrets: inherit

  rtd-sphinx-build:
    uses: scitex-ai/.github/.github/workflows/rtd-sphinx-build.yml@main
    secrets: inherit
    with:
      fail_on_warning: true

  native-qualified-test:
    if: github.event_name == 'workflow_dispatch' && inputs.native_test_profile
    permissions:
      contents: read
    uses: scitex-ai/.github/.github/workflows/leaf-release-sif.yml@4b2175758b236d57a90918a196f723b7400f0bbd
    with:
      operation: test
      source_commit: ${{ github.sha }}
      # Required test-plan label only: this job never creates a tag or artifact.
      release_tag: v1.0.0
