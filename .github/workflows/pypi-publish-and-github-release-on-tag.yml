name: release

# Central release route, modelled on scitex-io's admitted caller.
#
#   admission  organization membership, before any checkout or SIF execution
#   preflight  hosted: the existing vX.Y.Z tag resolves once to a commit that is
#              already on protected main, whose pyproject version equals the
#              tag, and whose version is not yet on PyPI
#   test       registered central executor (scitex-ai/.github
#              leaf-release-sif.yml, pinned below): the full 3.11/3.12/3.13
#              suite on the qualified compute-03 image/runtime/helper closure
#   build      same executor: wheel + sdist, the archive-identity proof, a
#              fresh installed-wheel probe and the proof again, then upload of
#              stats-dist-<commit>
#   publish    hosted, environment `pypi`, OIDC: re-resolve the tag, re-verify
#              the downloaded bytes against the source, then upload the wheel
#              and sdist only
#   release    hosted: GitHub Release from the same verified two assets
#
# Promote develop to main first; then push the tag or dispatch this workflow
# from main with an existing tag. The PyPI trusted publisher (this workflow
# file, environment `pypi`, repository scitex-ai/scitex-stats) is unchanged.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing vX.Y.Z tag to publish'
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: stats-release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ inputs.version || github.ref_name }}

jobs:
  admission:
    uses: scitex-ai/.github/.github/workflows/runner-admission.yml@208491cef2d9f5c77505f045e1e1633e368769ce
    with:
      runs_on: '["self-hosted","Linux","X64","scitex-org-cpu"]'

  preflight:
    needs: admission
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      commit: ${{ steps.identity.outputs.commit }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Require confirmed organization membership
        env:
          AUTHORIZED: ${{ needs.admission.outputs.native_authorized }}
        run: test "$AUTHORIZED" = true
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: identity
        name: Resolve the existing tag, promoted commit and unused version
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "::error::release tag must be vX.Y.Z: $RELEASE_TAG"; exit 1; }
          git fetch --no-tags origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" \
            "+refs/heads/main:refs/remotes/origin/main"
          commit="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor "$commit" refs/remotes/origin/main || {
            echo "::error::$RELEASE_TAG ($commit) is not on protected main"; exit 1; }
          version="${RELEASE_TAG#v}"
          project="$(git show "$commit:pyproject.toml" | python3 -c \
            'import sys, tomllib; p = tomllib.loads(sys.stdin.read())["project"]; print(p["name"], p["version"])')"
          [ "$project" = "scitex-stats $version" ] || {
            echo "::error::$commit declares '$project', not scitex-stats $version"; exit 1; }
          status="$(curl -sS -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/scitex-stats/$version/json")"
          [ "$status" = 404 ] || {
            echo "::error::scitex-stats $version is not an unused PyPI version (HTTP $status)"; exit 1; }
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release: $RELEASE_TAG -> $commit (on main, scitex-stats $version unused on PyPI)"

  test:
    needs: [admission, preflight]
    if: needs.admission.outputs.native_authorized == 'true'
    uses: scitex-ai/.github/.github/workflows/leaf-release-sif.yml@208491cef2d9f5c77505f045e1e1633e368769ce
    with:
      operation: test
      source_commit: ${{ needs.preflight.outputs.commit }}
      release_tag: ${{ needs.preflight.outputs.tag }}

  build:
    # Uploads stats-dist-<source_commit> only after the proof and the probe.
    needs: [admission, preflight, test]
    if: needs.admission.outputs.native_authorized == 'true'
    uses: scitex-ai/.github/.github/workflows/leaf-release-sif.yml@208491cef2d9f5c77505f045e1e1633e368769ce
    with:
      operation: build
      source_commit: ${{ needs.preflight.outputs.commit }}
      release_tag: ${{ needs.preflight.outputs.tag }}

  publish:
    needs: [admission, preflight, build]
    if: needs.admission.outputs.native_authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/scitex-stats
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_COMMIT: ${{ needs.preflight.outputs.commit }}
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: stats-dist-${{ needs.preflight.outputs.commit }}
          path: dist
      - name: Verify the tag and the downloaded bytes before upload
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" \
            "+refs/heads/main:refs/remotes/origin/main"
          [ "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT" ] || {
            echo "::error::$RELEASE_TAG moved after preflight"; exit 1; }
          git merge-base --is-ancestor "$RELEASE_COMMIT" refs/remotes/origin/main
          python -I .github/ci/release-identity.py verify-proof \
            --commit "$RELEASE_COMMIT" --version "$RELEASE_VERSION" --dist dist
          mkdir "$RUNNER_TEMP/proof"
          mv dist/release-proof.json "$RUNNER_TEMP/proof/"
          ls -l dist
          [ "$(find dist -mindepth 1 | wc -l)" -eq 2 ]
          test -f "dist/scitex_stats-$RELEASE_VERSION.tar.gz"
          test -f "dist/scitex_stats-$RELEASE_VERSION-py3-none-any.whl"
      - name: Publish the verified wheel and sdist (PyPI trusted publishing)
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          packages-dir: dist/

  release:
    needs: [preflight, build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_COMMIT: ${{ needs.preflight.outputs.commit }}
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: stats-dist-${{ needs.preflight.outputs.commit }}
          path: dist
      - name: Verify release assets and extract notes
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          [ "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT" ] || {
            echo "::error::$RELEASE_TAG moved after publication"; exit 1; }
          python -I .github/ci/release-identity.py verify-proof \
            --commit "$RELEASE_COMMIT" --version "$RELEASE_VERSION" --dist dist
          awk -v v="$RELEASE_VERSION" '
            $0 ~ "^## \\[" v "\\]" {p=1; next}
            p && /^## \[/ {exit}
            p
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"
      - name: Create the GitHub Release from the verified two assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "dist/scitex_stats-$RELEASE_VERSION-py3-none-any.whl" \
            "dist/scitex_stats-$RELEASE_VERSION.tar.gz"
